[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pm-agent-loop"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = []
authors = [
  { name = "Jared Groves", email = "jgroves27@gmail.com" },
]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",

]
dependencies = [
    "pydantic>=2.9.0",
    "anthropic>=0.40.0",
    "keyring>=24.3.0",
    "typer>=0.12.3",
]

[project.urls]
Documentation = "https://github.com/glunk-works/pm-agent-loop#readme"
Issues = "https://github.com/glunk-works/pm-agent-loop/issues"
Source = "https://github.com/glunk-works/pm-agent-loop"

[project.scripts]
pm-agent-loop = "pm_agent_loop:app"

[tool.hatch.version]
path = "src/pm_agent_loop/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/pm_agent_loop tests}"

[tool.coverage.run]
source_pkgs = ["pm_agent_loop", "tests"]
branch = true
parallel = true
omit = [
  "src/pm_agent_loop/__about__.py",
]

[tool.coverage.paths]
pm_agent_loop = ["src/pm_agent_loop", "*/pm-agent-loop/src/pm_agent_loop"]
tests = ["tests", "*/pm-agent-loop/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

# Hatch Environment Setup
[tool.hatch.envs.default]
dependencies = [
    "ruff>=0.4.0",
    "pytest",
    "pre-commit>=3.7.0",
    "cyclonedx-bom>=7.0.0",
]

[tool.hatch.envs.default.scripts]
lint = "ruff check ."
lint-fix = "ruff check . --fix"
format = "ruff format ."
test = "pytest {args}"
check-all = ["format", "lint"]

# Ruff Configuration
[tool.ruff]
line-length = 88
target-version = "py312" # Bumped to match Python 3.12+
src = ["src", "tests"]

[tool.ruff.lint]
# S: flake8-bandit (Strict security checks)
# B: flake8-bugbear (Catches common design flaws)
select = ["E", "W", "F", "I", "S", "B"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# S101: `assert` is the idiomatic pytest mechanism for test assertions, not a
# production safety risk when confined to the test suite.
"tests/*" = ["S101"]

[tool.ruff.lint.flake8-bugbear]
# Typer's documented CLI pattern requires calling typer.Option()/typer.Argument()
# as parameter defaults so it can introspect them; this is not the mutable-default
# footgun B008 otherwise guards against.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
