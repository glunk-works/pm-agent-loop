[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pm-agent-loop"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = []
authors = [
  { name = "Jared Groves", email = "jgroves27@gmail.com" },
]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",

]
dependencies = []

[project.urls]
Documentation = "https://github.com/glunk-works/pm-agent-loop#readme"
Issues = "https://github.com/glunk-works/pm-agent-loop/issues"
Source = "https://github.com/glunk-works/pm-agent-loop"

[tool.hatch.version]
path = "src/pm_agent_loop/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/pm_agent_loop tests}"

[tool.coverage.run]
source_pkgs = ["pm_agent_loop", "tests"]
branch = true
parallel = true
omit = [
  "src/pm_agent_loop/__about__.py",
]

[tool.coverage.paths]
pm_agent_loop = ["src/pm_agent_loop", "*/pm-agent-loop/src/pm_agent_loop"]
tests = ["tests", "*/pm-agent-loop/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
