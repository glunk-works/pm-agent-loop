name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Hatch
        uses: pypa/hatch@install

      - name: Run Ruff Check (Linting)
        run: hatch run ruff check .

      - name: Run Ruff Format (Style Compliance)
        run: hatch run ruff format --check .

      - name: Run Test Suite
        run: hatch run pytest